<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF7F1"/>
      <stop offset="55%" stop-color="#F4ECE0"/>
      <stop offset="100%" stop-color="#EFE6D8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33472F"/>
      <stop offset="100%" stop-color="#2C3E2D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <!-- Thin gold frame -->
  <rect x="56" y="56" width="968" height="1238" fill="none" stroke="#C4A35A" stroke-width="2"/>
  <rect x="74" y="74" width="932" height="1202" fill="none" stroke="#E8D5A3" stroke-width="1"/>

  <!-- Top label -->
  <text x="540" y="180" text-anchor="middle" fill="#C4A35A" font-size="26" letter-spacing="14" font-family="'Jost', Helvetica, Arial, sans-serif">S A V E&#160;&#160;T H E&#160;&#160;D A T E</text>

  <!-- Names -->
  <text x="540" y="330" text-anchor="middle" fill="#1a1410" font-size="124" font-weight="300">Ema</text>
  <text x="540" y="430" text-anchor="middle" fill="#C4A35A" font-size="74" font-style="italic">&amp;</text>
  <text x="540" y="540" text-anchor="middle" fill="#1a1410" font-size="124" font-weight="300">Juraj</text>

  <!-- Decorative divider -->
  <line x1="430" y1="600" x2="650" y2="600" stroke="#C4A35A" stroke-width="1"/>
  <circle cx="540" cy="600" r="5" fill="#C4A35A"/>

  <!-- Date band -->
  <text x="540" y="690" text-anchor="middle" fill="#3a3028" font-size="32" font-style="italic">s láskou Vás pozývajú na svoju svadbu</text>
  <text x="540" y="790" text-anchor="middle" fill="#2C3E2D" font-size="78" letter-spacing="4">29. mája 2027</text>
  <text x="540" y="838" text-anchor="middle" fill="#C4A35A" font-size="24" letter-spacing="10" font-family="'Jost', Helvetica, Arial, sans-serif">S O B O T A</text>

  <!-- Two info columns -->
  <!-- Ceremony -->
  <g fill="none" stroke="#C4A35A" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M335 928 v18 M328 937 h14"/>
    <path d="M335 950 L362 974 v6 h-54 v-6 Z"/>
    <rect x="326" y="980" width="18" height="14"/>
  </g>
  <text x="335" y="1018" text-anchor="middle" fill="#C4A35A" font-size="20" letter-spacing="6" font-family="'Jost', Helvetica, Arial, sans-serif">S O B Á Š</text>
  <text x="335" y="1062" text-anchor="middle" fill="#1a1410" font-size="34">Kostol sv. Jozefa</text>
  <text x="335" y="1100" text-anchor="middle" fill="#1a1410" font-size="34">robotníka</text>
  <text x="335" y="1142" text-anchor="middle" fill="#7a6f60" font-size="26" font-style="italic">Žilina</text>
  <text x="335" y="1192" text-anchor="middle" fill="#2C3E2D" font-size="30" letter-spacing="4">15:00</text>

  <!-- Vertical divider -->
  <line x1="540" y1="930" x2="540" y2="1200" stroke="#E8D5A3" stroke-width="1"/>

  <!-- Celebration -->
  <g fill="none" stroke="#C4A35A" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M731 930 h28 l-3 18 a11 11 0 0 1 -22 0 Z"/>
    <path d="M745 970 v18 M735 990 h20"/>
  </g>
  <text x="745" y="1018" text-anchor="middle" fill="#C4A35A" font-size="20" letter-spacing="6" font-family="'Jost', Helvetica, Arial, sans-serif">O S L A V A</text>
  <text x="745" y="1062" text-anchor="middle" fill="#1a1410" font-size="34">Kaštieľ</text>
  <text x="745" y="1100" text-anchor="middle" fill="#1a1410" font-size="34">Krasňany</text>
  <text x="745" y="1142" text-anchor="middle" fill="#7a6f60" font-size="26" font-style="italic">Krasňany</text>
  <text x="745" y="1192" text-anchor="middle" fill="#2C3E2D" font-size="30" letter-spacing="4">18:00</text>

  <!-- Bottom note -->
  <line x1="490" y1="1232" x2="590" y2="1232" stroke="#C4A35A" stroke-width="1"/>
  <text x="540" y="1268" text-anchor="middle" fill="#7a6f60" font-size="23" font-style="italic">Potvrďte prosím svoju účasť na našej svadobnej stránke</text>
</svg>
