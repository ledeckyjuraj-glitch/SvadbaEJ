<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Oznámenie o svadbe Ema a Juraj</title>
  <desc id="desc">Elegantné svadobné oznámenie v teplej farbe s menami, dátumom a adresami.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f1e6"/>
      <stop offset="100%" stop-color="#efe3d0"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#c7a25a"/>
      <stop offset="50%" stop-color="#e7d5a6"/>
      <stop offset="100%" stop-color="#c7a25a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1a1410" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bgGrad)"/>

  <g opacity="0.12">
    <circle cx="170" cy="180" r="8" fill="#c7a25a"/>
    <circle cx="1010" cy="200" r="7" fill="#c7a25a"/>
    <circle cx="1110" cy="1180" r="10" fill="#c7a25a"/>
    <circle cx="120" cy="1270" r="12" fill="#c7a25a"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="110" y="110" width="980" height="1280" rx="18" fill="#f9f6f1" stroke="#d9c39d" stroke-width="2"/>
  </g>

  <rect x="160" y="160" width="880" height="1180" rx="10" fill="none" stroke="#d7bc7d" stroke-width="1.5"/>

  <g>
    <text x="600" y="235" text-anchor="middle" font-size="26" letter-spacing="8" fill="#b28d49" font-family="Georgia, 'Times New Roman', serif" style="text-transform: uppercase;">Oznámenie o svadbe</text>
    <line x1="405" y1="265" x2="795" y2="265" stroke="url(#goldGlow)" stroke-width="2"/>
  </g>

  <g>
    <text x="600" y="430" text-anchor="middle" font-size="132" font-weight="400" fill="#1d1713" font-family="Georgia, 'Times New Roman', serif" letter-spacing="1.5">Ema</text>
    <text x="600" y="510" text-anchor="middle" font-size="82" fill="#b28d49" font-family="Georgia, 'Times New Roman', serif" font-style="italic">&amp;</text>
    <text x="600" y="590" text-anchor="middle" font-size="132" font-weight="400" fill="#1d1713" font-family="Georgia, 'Times New Roman', serif" letter-spacing="1.5">Juraj</text>
  </g>

  <g>
    <line x1="420" y1="670" x2="780" y2="670" stroke="#d5b96f" stroke-width="1.5"/>
    <text x="600" y="730" text-anchor="middle" font-size="30" letter-spacing="8" fill="#5b4b3d" font-family="Arial, Helvetica, sans-serif" style="text-transform: uppercase;">S láskou vás pozývame</text>
  </g>

  <g>
    <text x="600" y="835" text-anchor="middle" font-size="70" fill="#1d1713" font-family="Georgia, 'Times New Roman', serif" letter-spacing="2">29. máj 2027</text>
  </g>

  <g>
    <rect x="260" y="905" width="680" height="220" rx="12" fill="#faf6f0" stroke="#e1c88a" stroke-width="1.5"/>

    <text x="600" y="972" text-anchor="middle" font-size="22" letter-spacing="6" fill="#af8d50" font-family="Arial, Helvetica, sans-serif" style="text-transform: uppercase;">Svätba</text>

    <text x="600" y="1038" text-anchor="middle" font-size="34" fill="#1d1713" font-family="Georgia, 'Times New Roman', serif">Kostol sv. Jozefa, robotníka</text>
    <text x="600" y="1088" text-anchor="middle" font-size="28" fill="#4b3f37" font-family="Arial, Helvetica, sans-serif" letter-spacing="1.2">Horná 1226/2A, 010 03 Žilina</text>

    <line x1="440" y1="1115" x2="760" y2="1115" stroke="#d9c292" stroke-width="1.2"/>

    <text x="600" y="1162" text-anchor="middle" font-size="26" fill="#4b3f37" font-family="Georgia, 'Times New Roman', serif">Oslava: Kaštieľ Krasňany, Krasňany 21</text>
  </g>

  <g opacity="0.9">
    <circle cx="350" cy="1305" r="6" fill="#c7a25a"/>
    <circle cx="600" cy="1305" r="6" fill="#c7a25a"/>
    <circle cx="850" cy="1305" r="6" fill="#c7a25a"/>
  </g>

  <g>
    <text x="600" y="1370" text-anchor="middle" font-size="22" letter-spacing="5" fill="#7a675d" font-family="Arial, Helvetica, sans-serif">VÁS SRDČNE POZÝVAJÚ</text>
  </g>
</svg>
