<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF7F1"/>
      <stop offset="100%" stop-color="#F4ECE0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#bg)"/>

  <!-- Outer gold frame -->
  <rect x="60" y="60" width="960" height="1230" fill="none" stroke="#C4A35A" stroke-width="2"/>
  <rect x="78" y="78" width="924" height="1194" fill="none" stroke="#E8D5A3" stroke-width="1"/>

  <!-- Top label -->
  <text x="540" y="245" text-anchor="middle" fill="#C4A35A" font-size="30" letter-spacing="16" font-family="'Jost', Helvetica, Arial, sans-serif">S A V E&#160;&#160;T H E&#160;&#160;D A T E</text>

  <!-- Decorative divider -->
  <line x1="440" y1="300" x2="640" y2="300" stroke="#C4A35A" stroke-width="1"/>
  <circle cx="540" cy="300" r="5" fill="#C4A35A"/>

  <!-- Names -->
  <text x="540" y="510" text-anchor="middle" fill="#1a1410" font-size="150" font-weight="300">Ema</text>
  <text x="540" y="630" text-anchor="middle" fill="#C4A35A" font-size="92" font-style="italic">&amp;</text>
  <text x="540" y="760" text-anchor="middle" fill="#1a1410" font-size="150" font-weight="300">Juraj</text>

  <!-- Sub line -->
  <text x="540" y="840" text-anchor="middle" fill="#3a3028" font-size="34" font-style="italic">sa budú brať</text>

  <!-- Divider -->
  <line x1="465" y1="895" x2="615" y2="895" stroke="#E8D5A3" stroke-width="1"/>

  <!-- Date -->
  <text x="540" y="985" text-anchor="middle" fill="#2C3E2D" font-size="74" letter-spacing="6">29. mája 2027</text>
  <text x="540" y="1035" text-anchor="middle" fill="#C4A35A" font-size="26" letter-spacing="10" font-family="'Jost', Helvetica, Arial, sans-serif">S O B O T A&#160;&#160;&#183;&#160;&#160;15:00</text>

  <!-- Place -->
  <text x="540" y="1130" text-anchor="middle" fill="#3a3028" font-size="40">Kostol sv. Jozefa robotníka</text>
  <text x="540" y="1175" text-anchor="middle" fill="#3a3028" font-size="32" opacity="0.8">Žilina</text>

  <!-- Bottom note -->
  <line x1="490" y1="1215" x2="590" y2="1215" stroke="#C4A35A" stroke-width="1"/>
  <text x="540" y="1250" text-anchor="middle" fill="#7a6f60" font-size="24" font-style="italic">Podrobnosti a potvrdenie účasti čoskoro</text>
</svg>
